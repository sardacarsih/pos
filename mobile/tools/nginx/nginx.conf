# Disajikan ke update.kopkarksk.com lewat Cloudflare Tunnel (hostname -> http://localhost:8081).
# Hanya mendengarkan loopback; tunnel yang menjangkaunya.
worker_processes 1;
error_log logs/error.log warn;
pid       logs/nginx.pid;

events { worker_connections 256; }

http {
    include      mime.types;
    default_type application/octet-stream;
    types { application/vnd.android.package-archive apk; }

    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/json application/javascript image/svg+xml;
    access_log logs/access.log;

    server {
        listen 127.0.0.1:8081;
        server_name update.kopkarksk.com localhost;
        root D:/update-site;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = /index.html { add_header Cache-Control "no-cache"; }
        location = /          { add_header Cache-Control "no-cache"; }

        # Sumber kebenaran: folder yang sama dengan api.kopkarksk.com/downloads (diisi tools/rilis-apk.ps1).
        location = /version.json {
            alias D:/be-rustapi/downloads/version.json;
            add_header Cache-Control "no-cache";
        }
        # Tautan tetap: tanpa cache agar Cloudflare tidak menyajikan APK lama.
        location = /pos-kasir.apk {
            alias D:/be-rustapi/downloads/pos-kasir.apk;
            add_header Content-Disposition 'attachment; filename="pos-kasir.apk"';
            add_header Cache-Control "no-cache";
        }
        # APK berversi (pos-kasir-<build>.apk): dipakai halaman unduh lewat version.json.
        # Nama berubah tiap rilis, jadi aman di-cache lama.
        location ~ ^/(pos-kasir-[0-9]+\.apk)$ {
            alias D:/be-rustapi/downloads/$1;
            add_header Content-Disposition 'attachment; filename="$1"';
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # PWA iPhone: https://ios.kopkarksk.com (hostname Cloudflare Tunnel -> http://localhost:8081).
    # Web statis + proxy /api ke Rust API di origin yang sama, jadi tidak perlu CORS.
    server {
        listen 127.0.0.1:8081;
        server_name ios.kopkarksk.com;
        root D:/ios-web;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            client_max_body_size 2m;
        }
        location = /index.html { add_header Cache-Control "no-cache"; }
        location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
        location = /version.json { add_header Cache-Control "no-cache"; }
        location / { try_files $uri $uri/ /index.html; }
    }

    # Web admin: https://admin.kopkarksk.com (hostname Cloudflare Tunnel -> http://localhost:8081).
    # Build sendiri (API_URL = origin ini), folder D:/admin-web, diisi tools/rilis-web.ps1 -Dir D:/admin-web.
    server {
        listen 127.0.0.1:8081;
        server_name admin.kopkarksk.com;
        root D:/admin-web;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            client_max_body_size 2m;
        }
        location = /index.html { add_header Cache-Control "no-cache"; }
        location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
        location = /version.json { add_header Cache-Control "no-cache"; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
