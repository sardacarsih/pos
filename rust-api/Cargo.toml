[package]
name = "pos-api"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", features = ["password-hash", "alloc", "rand_core"] }
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
imagesize = "0.15.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
oracle = { version = "0.6.3", features = ["chrono"] }
rust_decimal = { version = "1.43.0", features = ["macros", "serde-arbitrary-precision"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.1", features = ["v4"] }
